<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>封面 · 横幅版</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html,
      body { width: 1920px; height: 620px; overflow: hidden; }

      body {
        position: relative;
        font-family: 'Noto Sans SC', '微软雅黑', 'Microsoft YaHei', sans-serif;
        color: #fff;
        background:
          radial-gradient(760px 460px at 26% -20%, rgba(255, 255, 255, 0.22), transparent 64%),
          repeating-conic-gradient(from -8deg at 22% 0%, rgba(255,255,255,.07) 0deg 3.6deg, transparent 3.6deg 10deg),
          linear-gradient(120deg, #17002e 0%, #4b0082 34%, #a80072 72%, #e0187f 100%);
      }

      body::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
        background-size: 30px 30px;
        -webkit-mask-image: radial-gradient(ellipse 80% 100% at 40% 30%, #000 0%, transparent 100%);
      }

      .stage { position: relative; z-index: 2; height: 100%; padding: 46px 72px 0; }

      .eyebrow {
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 16px;
        letter-spacing: 0.34em;
        color: rgba(255, 255, 255, 0.7);
      }

      h1 {
        margin-top: 16px;
        font-family: '华文琥珀', STHupo, '华文新魏', serif;
        font-size: 92px;
        line-height: 1;
        letter-spacing: 0.015em;
        background: linear-gradient(92deg, #fff200 0%, #ff9a00 20%, #ff2d95 46%, #b06cff 70%, #59e3ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        -webkit-text-stroke: 2.6px #fff;
        filter: drop-shadow(0 3px 0 #8a0050) drop-shadow(0 7px 0 #4b0030)
          drop-shadow(0 0 30px rgba(255, 45, 149, 0.7));
      }

      .tagline {
        margin-top: 18px;
        font-size: 27px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
      }

      .sub {
        margin-top: 8px;
        font-size: 18px;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.8);
      }

      .sub b { color: #ffd54a; }

      .shot {
        position: absolute;
        right: 66px;
        top: 66px;
        width: 800px;
        height: 500px;
        border-radius: 14px;
        overflow: hidden;
        border: 3px solid rgba(255, 213, 74, 0.92);
        box-shadow: 0 30px 56px -24px rgba(0, 0, 0, 0.85), 0 0 44px -8px rgba(255, 45, 149, 0.6);
        transform: rotate(1.6deg);
      }

      .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }

      .shot-label {
        position: absolute;
        left: 12px;
        bottom: 10px;
        padding: 5px 13px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.28);
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 14px;
        letter-spacing: 0.1em;
      }

      .foot {
        position: absolute;
        left: 72px;
        bottom: 34px;
        display: flex;
        gap: 26px;
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 14px;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.55);
      }

      .chips { display: flex; gap: 10px; margin-top: 20px; }

      .chip {
        padding: 6px 14px;
        border: 1px solid rgba(255, 213, 74, 0.6);
        border-radius: 999px;
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 14px;
        letter-spacing: 0.1em;
        color: #ffd54a;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="eyebrow">AI 开发大赛 · 现场 DEMO</div>
      <h1>五毛钱人生仪表盘</h1>
      <p class="tagline">记录得越认真，看板越离谱。</p>
      <p class="sub">日记 × 数据看板 × 五毛钱特效 —— 一根「<b>特效预算</b>」滑杆切换两种人格</p>
      <div class="chips">
        <span class="chip">¥0.00 极简稿纸</span>
        <span class="chip">¥3.50 默认</span>
        <span class="chip">¥5.00 五毛钱 MAX</span>
      </div>
      <div class="shot">
        <img src="../output/playwright/shots/06-dash-fx500-1440.png" alt="数据看板" />
        <div class="shot-label">数据看板 · ¥5.00</div>
      </div>
      <div class="foot">
        <span>REACT 18 + TYPESCRIPT + VITE 5</span>
        <span>纯前端 · 零联网 · 六张手写 SVG 图表</span>
      </div>
    </div>
  </body>
</html>
