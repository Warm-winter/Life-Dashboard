<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>封面 · 五毛钱人生仪表盘</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      body {
        position: relative;
        font-family: 'Noto Sans SC', '微软雅黑', 'Microsoft YaHei', sans-serif;
        color: #fff;
        background:
          radial-gradient(1100px 640px at 50% -14%, rgba(255, 255, 255, 0.22), transparent 62%),
          repeating-conic-gradient(
            from -8deg at 50% 6%,
            rgba(255, 255, 255, 0.075) 0deg 3.6deg,
            transparent 3.6deg 10deg
          ),
          linear-gradient(140deg, #17002e 0%, #4b0082 30%, #a80072 68%, #e0187f 100%);
      }

      /* 网格纸底纹，和 ¥0 档呼应 */
      body::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 34px 34px;
        -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, #000 0%, transparent 100%);
        pointer-events: none;
      }

      .stage {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        padding: 56px 110px 0;
      }

      /* ── 顶部 ── */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .eyebrow {
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 19px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.72);
      }

      .stamp {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 20px 9px 12px;
        border: 2px solid #ffd54a;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
      }

      .stamp .coin {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: conic-gradient(from 210deg, #ffe98a, #ffb300, #ff2d95, #ffb300, #ffe98a);
        color: #2a1600;
        border: 2px solid #2a1600;
        font-family: 'Cascadia Mono', monospace;
        font-weight: 800;
        font-size: 19px;
      }

      .stamp span {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.16em;
        color: #ffd54a;
      }

      /* ── 标题 ── */
      .title {
        margin-top: 26px;
        font-family: '华文琥珀', STHupo, '华文新魏', serif;
        font-size: 118px;
        line-height: 1.02;
        letter-spacing: 0.015em;
        background: linear-gradient(92deg, #fff200 0%, #ff9a00 20%, #ff2d95 46%, #b06cff 70%, #59e3ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        -webkit-text-stroke: 3px #fff;
        filter: drop-shadow(0 4px 0 #8a0050) drop-shadow(0 9px 0 #4b0030)
          drop-shadow(0 0 34px rgba(255, 45, 149, 0.75));
      }

      .tagline {
        margin-top: 22px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #fff;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
      }

      .sub {
        margin-top: 10px;
        font-size: 22px;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.82);
      }

      .sub b {
        color: #ffd54a;
      }

      /* ── 两张对照截图 ── */
      .shots {
        position: relative;
        margin-top: 34px;
        height: 500px;
      }

      .shot {
        position: absolute;
        top: 0;
        width: 820px;
        height: 500px;
        border-radius: 16px;
        overflow: hidden;
        border: 3px solid rgba(255, 213, 74, 0.92);
        background: #17002b;
        box-shadow:
          0 34px 60px -22px rgba(0, 0, 0, 0.85),
          0 0 46px -8px rgba(255, 45, 149, 0.55);
      }

      .shot img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }

      .shot--min {
        left: 0;
        transform: rotate(-2.2deg);
        border-color: rgba(200, 69, 45, 0.95);
        box-shadow:
          0 30px 54px -24px rgba(0, 0, 0, 0.55),
          0 0 0 6px rgba(255, 255, 255, 0.14);
      }

      .shot--max {
        right: 0;
        transform: rotate(2.2deg);
      }

      .shot-label {
        position: absolute;
        bottom: 12px;
        left: 14px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.28);
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 15px;
        letter-spacing: 0.1em;
        backdrop-filter: blur(4px);
      }

      /* ── 价格尺 ── */
      .ruler {
        margin-top: 40px;
        display: flex;
        align-items: center;
        gap: 38px;
      }

      .ruler-track {
        position: relative;
        flex: 1;
        margin: 0 20px 0 10px;
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(90deg, #9aa0a6 0%, #ffd54a 46%, #ff2d95 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      }

      .tick {
        position: absolute;
        top: 18px;
        transform: translateX(-50%);
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 15px;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.78);
        white-space: nowrap;
      }

      .tick::before {
        content: '';
        position: absolute;
        left: 50%;
        top: -14px;
        width: 2px;
        height: 10px;
        background: rgba(255, 255, 255, 0.6);
      }

      .knob {
        position: absolute;
        top: 50%;
        left: 80%;
        width: 30px;
        height: 30px;
        margin: -15px 0 0 -15px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: radial-gradient(circle at 35% 30%, #fff, #ffd54a 60%);
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.6);
      }

      .stats {
        display: flex;
        gap: 18px;
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 16px;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.8);
        white-space: nowrap;
      }

      .stats b {
        color: #ffd54a;
      }

      .foot {
        margin-top: 34px;
        display: flex;
        justify-content: space-between;
        font-family: 'Cascadia Mono', Consolas, monospace;
        font-size: 15px;
        letter-spacing: 0.14em;
        color: rgba(255, 255, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="top">
        <div class="eyebrow">AI 开发大赛 · 现场 Demo</div>
        <div class="stamp"><span class="coin">¥</span><span>¥0.50 旗舰版</span></div>
      </div>

      <h1 class="title">五毛钱人生仪表盘</h1>
      <p class="tagline">记录得越认真，看板越离谱。</p>
      <p class="sub">日记 × 数据看板 × 五毛钱特效 —— 一根「<b>特效预算</b>」滑杆，切换两种人格</p>

      <div class="shots">
        <div class="shot shot--min">
          <img src="../output/playwright/shots/01-write-fx000-1440.png" alt="极简稿纸模式" />
          <div class="shot-label">¥0.00 · 极简稿纸</div>
        </div>
        <div class="shot shot--max">
          <img src="../output/playwright/shots/06-dash-fx500-1440.png" alt="五毛钱 MAX 模式" />
          <div class="shot-label">¥5.00 · 五毛钱 MAX</div>
        </div>
      </div>

      <div class="ruler">
        <div class="ruler-track">
          <i class="knob"></i>
          <span class="tick" style="left: 0%">¥0</span>
          <span class="tick" style="left: 20%">0.5</span>
          <span class="tick" style="left: 40%">1</span>
          <span class="tick" style="left: 60%">2</span>
          <span class="tick" style="left: 80%">3.5</span>
          <span class="tick" style="left: 100%">¥5</span>
        </div>
        <div class="stats">
          六张手写 SVG 图表 · <b>51</b> 条单测 · <b>32</b> 条 E2E
        </div>
      </div>

      <div class="foot">
        <span>REACT 18 + TYPESCRIPT + VITE 5</span>
        <span>纯前端 · 零联网 · 数据只存本机 · 断网也能跑</span>
      </div>
    </div>
  </body>
</html>
